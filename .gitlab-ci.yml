stages:
  - build
  - image
  - smoke
  - release

variables:
  IMAGEN: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore MateriasService
    - dotnet build MateriasService --no-restore --configuration Release

# Plantilla: Docker dentro del job + login al registry, solo en la rama por defecto
.docker:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publicar-imagen:
  extends: .docker
  stage: image
  script:
    - docker build -t "$IMAGEN" MateriasService
    - docker push "$IMAGEN"

prueba-humo:
  extends: .docker
  stage: smoke
  script:
    - docker network create humo
    - docker run -d --name sqlserver --network humo
        -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=Humo.Prueba.2026
        mcr.microsoft.com/mssql/server:2022-latest
    - docker run -d --name materias --network humo --restart on-failure
        -e ConnectionStrings__DefaultConnection="Server=sqlserver;Database=MateriasDb;User Id=sa;Password=Humo.Prueba.2026;TrustServerCertificate=True"
        -e Jwt__Key="clave-solo-para-la-prueba-de-humo-de-32-caracteres"
        "$IMAGEN"
    - docker run --rm --network humo curlimages/curl:8.10.1
        --fail --silent --show-error --retry 30 --retry-delay 3 --retry-all-errors
        http://materias:8080/health
        || (docker logs materias; exit 1)

promover-latest:
  extends: .docker
  stage: release
  script:
    - docker pull "$IMAGEN"
    - docker tag "$IMAGEN" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"